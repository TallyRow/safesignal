# SafeSignal CI/CD pipeline.
#
# Two logical pipelines defined by job rules:
#   1. Quality-gate pipeline — every MR + every default-branch push.
#      Stages: build, typecheck, test, audit (bundle-invariance,
#      dependency-pins, dco-check).
#   2. Release pipeline — push of a signed `v*.*.*` git tag.
#      Stages: build, typecheck (+ verify-tag-signed), test, audit
#      (bundle-invariance, dependency-pins, changelog-validate),
#      publish (npm publish --provenance via GitLab OIDC trusted-
#      publisher), publish (provenance-verify).
#
# build runs FIRST and publishes dist/ as an artifact: the public-API
# contract + quickstart tests import the package by name
# (`@tallyrow/safesignal[/subpath]`), which only resolves through the
# package `exports` map to `dist/` — so typecheck and test both consume
# the build artifact. (Without this, CI starts dist-less and those
# package-name imports fail to resolve even though they pass locally,
# where a stale dist/ is present.)
#
# Spec:      specs/005-cicd-pipeline/spec.md
# Plan:      specs/005-cicd-pipeline/plan.md
# Contracts: specs/005-cicd-pipeline/contracts/
#
# Constraint: GitLab.com free-tier shared runners
# (saas-linux-small-amd64).

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
  before_script:
    - apk add --no-cache git bash gpg openssh-client
    - npm config set cache .npm --location=project
    - npm ci --prefer-offline --no-audit --no-fund

stages:
  - build
  - typecheck
  - test
  - audit
  - publish

# ----------------------------------------------------------------
# Reusable definitions
# ----------------------------------------------------------------

# Node version matrix for stages where it matters
# (typecheck / test / build). Single-Node stages
# (audit / publish) use the default Node 22 image.
.node_matrix:
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  image: node:${NODE_VERSION}-alpine

# Run on every merge request to the default branch
# and on every default-branch push.
.quality_gate_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Run only on signed release tags.
# Tag must match v[MAJOR].[MINOR].[PATCH] with optional
# pre-release suffix (-rc.N, -beta.N, etc.).
.release_only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

# ----------------------------------------------------------------
# Quality-gate jobs (MR + default-branch pipelines)
# ----------------------------------------------------------------

build:
  stage: build
  extends: [.node_matrix, .quality_gate_rules]
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

typecheck:
  stage: typecheck
  extends: [.node_matrix, .quality_gate_rules]
  # Consume the Node-22 dist/ build so package-name imports
  # (`@tallyrow/safesignal[/subpath]`) in the contract + quickstart
  # tests resolve via the exports map. dist is version-independent JS,
  # so one build artifact serves both Node-matrix typecheck jobs.
  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - npm run typecheck

test:
  stage: test
  extends: [.node_matrix, .quality_gate_rules]
  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - npm test

bundle-invariance:
  stage: audit
  extends: .quality_gate_rules
  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - scripts/ci/bundle-invariance-check.sh

dependency-pins:
  stage: audit
  extends: .quality_gate_rules
  script:
    - npm test -- tests/contract/dependency-pins.test.ts tests/security/bundle-shape.security.test.ts tests/security/transport-beacon-bundle-shape.security.test.ts

dco-check:
  stage: audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - scripts/ci/dco-check.sh

# Quality gates added in Feature 006 (lint / format / coverage).
# Default Node-22 image; run on source, so no build artifact needed.
lint:
  stage: audit
  extends: .quality_gate_rules
  needs: []
  script:
    - npm run lint

format-check:
  stage: audit
  extends: .quality_gate_rules
  needs: []
  script:
    - npm run format:check

coverage:
  stage: audit
  extends: .quality_gate_rules
  # Runs the full suite under coverage; the contract/quickstart tests
  # import `@tallyrow/safesignal` by name, which resolves only via the
  # built dist/ exports map — so consume the Node-22 build artifact.
  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - npm run test:coverage

# Secret scanning (Feature 006, US1). GitLab-native Secret Detection does not
# gate on the free tier, so we use pinned gitleaks (OSS) for a real gate that
# fails on any non-allowlisted finding. Uses its own image (no Node), so
# override before_script/cache and run with needs: [].
#
# NOTE: dependency scanning (osv-scanner) is deferred until Renovate (US4) has
# driven the dev-toolchain major upgrades (happy-dom 20, vitest 4) — the only
# fixes for the current dev-only advisories. It will be added against a clean
# tree afterward. See specs/006-developer-ergonomics/tasks.md T009.
secret-scan:
  stage: audit
  extends: .quality_gate_rules
  needs: []
  image:
    name: zricethezav/gitleaks:v8.18.2
    entrypoint: [""]
  before_script: []
  cache: {}
  script:
    - gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose

# ----------------------------------------------------------------
# Release pipeline jobs (signed-tag triggered)
# ----------------------------------------------------------------

verify-tag-signed:
  stage: typecheck   # fail-fast - runs immediately via needs: []
  extends: .release_only
  needs: []          # start at once (build is now the first stage)
  before_script: []  # skip default - no npm install needed
  image: alpine:latest
  script:
    # Each step exits non-zero on failure - GitLab CI auto-fails the job.
    # Tags are SSH-signed; git tag -v verifies the signature against the
    # committed .gitlab/allowed_signers allowlist (public keys only). This
    # is self-contained - no token, no key import from CI variables. The
    # GitLab tag signature API does not expose verification_status for SSH
    # tags, so we verify cryptographically in-runner instead.
    # git merge-base --is-ancestor exits 1 if the commit isn't an ancestor.
    - apk add --no-cache git openssh-keygen
    - git config gpg.format ssh
    - git config gpg.ssh.allowedSignersFile .gitlab/allowed_signers
    - 'echo "Verifying SSH signature on tag $CI_COMMIT_TAG against .gitlab/allowed_signers..."'
    - git fetch --no-tags origin "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG" 2>/dev/null || true
    - git tag -v "$CI_COMMIT_TAG"
    - 'echo "Verifying tagged commit is on $CI_DEFAULT_BRANCH..."'
    - git fetch --depth=100 origin "$CI_DEFAULT_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"
    - 'echo "Tag $CI_COMMIT_TAG verified - signed by an allowed signer and on $CI_DEFAULT_BRANCH"'

# Release-pipeline matrix jobs (typecheck/test/build × 2 Node versions)
release-build:
  stage: build
  extends: [.node_matrix, .release_only]
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

release-typecheck:
  stage: typecheck
  extends: [.node_matrix, .release_only]
  needs:
    - job: release-build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - npm run typecheck

release-test:
  stage: test
  extends: [.node_matrix, .release_only]
  needs:
    - job: release-build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - npm test

release-bundle-invariance:
  stage: audit
  extends: .release_only
  needs:
    - job: release-build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
  script:
    - scripts/ci/bundle-invariance-check.sh

release-dependency-pins:
  stage: audit
  extends: .release_only
  script:
    - npm test -- tests/contract/dependency-pins.test.ts tests/security/bundle-shape.security.test.ts tests/security/transport-beacon-bundle-shape.security.test.ts

changelog-validate:
  stage: audit
  extends: .release_only
  script:
    - scripts/ci/changelog-validate.sh

publish:
  stage: publish
  extends: .release_only
  needs:
    - verify-tag-signed
    - release-typecheck
    - release-test
    - job: release-build
      artifacts: true
      parallel:
        matrix:
          - NODE_VERSION: "22"
    - release-bundle-invariance
    - release-dependency-pins
    - changelog-validate
  id_tokens:
    NPM_ID_TOKEN:
      # npm requires this exact audience for OIDC trusted publishing on
      # GitLab — NOT the registry URL. With the wrong aud the token
      # exchange fails at publish time.
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      # Separate token for `npm publish --provenance`: npm signs the
      # provenance attestation via Sigstore, which needs its own GitLab
      # id_token with the "sigstore" audience (distinct from the npm
      # auth token above).
      aud: "sigstore"
  script:
    # Derive dist-tag from the version string (POSIX case — alpine's
    # /bin/sh has no `[[ ]]`):
    #   v1.0.1      → latest (stable release)
    #   v1.0.1-rc.1 → next (pre-release; any version with a `-` suffix)
    - |
      case "$CI_COMMIT_TAG" in
        *-*) DIST_TAG="next" ;;
        *)   DIST_TAG="latest" ;;
      esac
      echo "Publishing $CI_COMMIT_TAG under dist-tag '$DIST_TAG'"
    # OIDC trusted publishing: npm >= 11.5.1 auto-detects the GitLab
    # NPM_ID_TOKEN id_token and exchanges it for a short-lived publish
    # token — no long-lived NPM_TOKEN, no manual _authToken. node:22
    # ships npm 10.x, so upgrade to a version with OIDC support first.
    - npm install -g npm@latest
    - npm publish --provenance --tag "$DIST_TAG"

provenance-verify:
  stage: publish
  extends: .release_only
  needs:
    - publish
  script:
    - scripts/ci/provenance-verify.sh "$CI_COMMIT_TAG"

# ----------------------------------------------------------------
# Scheduled dependency-update automation (Feature 006, US4)
# ----------------------------------------------------------------
#
# Runs ONLY on scheduled pipelines (Settings → CI/CD → Pipeline schedules,
# weekly, target main). Opens dependency-update MRs per renovate.json
# (minor/patch grouped, majors isolated). Requires the masked CI variable
# RENOVATE_TOKEN = a `safesignal`-scoped Project Access Token (Developer,
# api scope, non-publish) — a maintainer-side one-time setup.
renovate:
  stage: build
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  image:
    name: renovate/renovate:39
    entrypoint: [""]
  before_script: []
  cache: {}
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.com/api/v4
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: tallyrow/safesignal
    # RENOVATE_TOKEN is injected from the masked/protected project CI variable
    # automatically — do NOT redefine it here (a self-reference can pass through
    # empty/literal → "Authentication failure").
  script:
    - renovate
