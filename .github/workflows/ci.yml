name: CI

# Quality-gate pipeline for @tallyrow/safesignal — runs on every pull request
# targeting main and on every push to main. Mirrors the non-release jobs of the
# GitLab pipeline (Feature 005 + Feature 006): build / typecheck / test
# (Node 20 + 22), lint, format-check, coverage, bundle-invariance,
# dependency-pins, DCO sign-off, and a gitleaks secret scan.
#
# The host-neutral scripts/ci/*.sh helpers are reused unchanged by supplying the
# env vars they read (CI_MERGE_REQUEST_DIFF_BASE_SHA, CI_COMMIT_SHA,
# CI_DEFAULT_BRANCH).
#
# Release publishing lives in release.yml (signed-tag triggered). Dependency
# automation (Renovate) moves to the Renovate GitHub App or its own scheduled
# workflow — it is not a quality gate (tracked in migration issue #4).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Coalesce superseded runs of the same ref; safe to cancel quality checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build on both supported Node versions; upload the Node 22 dist/ once and
  # reuse it downstream — the contract/quickstart tests import the package by
  # name via the exports map → dist, so typecheck, test, and coverage all
  # consume the built artifact (dist is version-independent JS).
  build:
    name: build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Upload dist (Node 22 artifact, reused downstream)
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  typecheck:
    name: typecheck (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm run typecheck

  test:
    name: test (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm test

  # Lint and format run on source only (no build artifact needed).
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run format:check

  coverage:
    name: coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm run test:coverage

  bundle-invariance:
    name: bundle-invariance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script checks out + builds the base commit in a worktree
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Compare gzipped bundle sizes against the base
        run: |
          git fetch --depth=200 origin main || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare against the merge-base with the PR's target branch.
            export CI_MERGE_REQUEST_DIFF_BASE_SHA="$(git merge-base origin/main HEAD)"
          else
            # push to main: the script compares against the previous main commit.
            export CI_DEFAULT_BRANCH=main
          fi
          bash scripts/ci/bundle-invariance-check.sh

  dependency-pins:
    name: dependency-pins
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Bundle-shape tests inspect dist/, so they consume the build artifact.
      - run: >
          npm test --
          tests/contract/dependency-pins.test.ts
          tests/security/bundle-shape.security.test.ts
          tests/security/transport-beacon-bundle-shape.security.test.ts
          tests/security/transport-otlp-bundle-shape.security.test.ts

  # DCO sign-off applies to the commits a PR introduces (GitLab ran it on MRs).
  dco-check:
    name: dco-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base + head commits reachable for the rev-list range
      - name: Verify Signed-off-by on every PR commit
        env:
          CI_MERGE_REQUEST_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/dco-check.sh

  # Pinned gitleaks (OSS) run via Docker, matching the GitLab job's image + args.
  # GitLab-native Secret Detection did not gate on the free tier; this is a real
  # gate that fails on any non-allowlisted finding.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks detect
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.18.2 \
            detect --no-git --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose
