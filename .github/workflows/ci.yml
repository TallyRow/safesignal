name: CI

# Quality-gate pipeline for @tallyrow/safesignal — runs on every pull request
# targeting main and on every push to main. Mirrors the non-release jobs of the
# GitLab pipeline (Feature 005 + Feature 006): build / typecheck / test
# (Node 20 + 22), lint, format-check, coverage, dependency-pins, DCO
# sign-off, and a gitleaks secret scan.
#
# The host-neutral scripts/ci/*.sh helpers are reused unchanged by supplying the
# env vars they read (CI_MERGE_REQUEST_DIFF_BASE_SHA, CI_COMMIT_SHA,
# CI_DEFAULT_BRANCH).
#
# Release publishing lives in release.yml (signed-tag triggered). Dependency
# automation (Renovate) moves to the Renovate GitHub App or its own scheduled
# workflow — it is not a quality gate (tracked in migration issue #4).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Coalesce superseded runs of the same ref; safe to cancel quality checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build on both supported Node versions; upload the Node 22 dist/ once and
  # reuse it downstream — the contract/quickstart tests import the package by
  # name via the exports map → dist, so typecheck, test, and coverage all
  # consume the built artifact (dist is version-independent JS).
  build:
    name: build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Upload dist (Node 22 artifact, reused downstream)
        if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  typecheck:
    name: typecheck (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run typecheck

  test:
    name: test (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm test

  # Lint and format run on source only (no build artifact needed).
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run format:check

  coverage:
    name: coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run test:coverage

  # bundle-invariance gate removed 2026-06-10 (feature 023, owner decision):
  # the ±1 KiB merge-base delta check is retired for this single-maintainer
  # library. Accidental subpath leakage into the default entry remains
  # guarded by the static size-lock + export-surface tests
  # (tests/security/transport-beacon-bundle-shape.security.test.ts,
  # tests/contract/transport-beacon.contract.test.ts). Revisit if the
  # package gains external adopters who need tighter size discipline
  # (likely by splitting opt-in capture features into separate packages).

  dependency-pins:
    name: dependency-pins
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Packaging-contract tests inspect dist/, so they consume the build
      # artifact. Includes the distributed-surface parity gate (Feature 012 /
      # issue #6): `npm pack` ↔ exports ↔ docs parity, fail-closed.
      - name: "Packaging contracts: dependency-pins, bundle-shape, distributed-surface parity"
        run: >
          npm test --
          tests/contract/dependency-pins.test.ts
          tests/contract/distributed-surface.contract.test.ts
          tests/security/bundle-shape.security.test.ts
          tests/security/transport-beacon-bundle-shape.security.test.ts
          tests/security/transport-otlp-bundle-shape.security.test.ts

  # Deprecate-before-remove gate (Feature 011 / issue #5): compares the built
  # public API surface against the committed baseline (api/surface.json) and
  # fails closed on an undeprecated removal or incompatible change. Consumes the
  # build artifact; the gate is a cross-platform Node entrypoint (no bash).
  api-surface:
    name: api-surface
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run api:check

  # DCO sign-off applies to the commits a PR introduces (GitLab ran it on MRs).
  # The Renovate GitHub App's bot commits carry no Signed-off-by trailer, so
  # `renovate/*` PRs are exempt — the job skips (a skip is not a failure for the
  # ci-success gate below). DCO is a contributor-agreement check, not a security
  # gate; the bot is a trusted org-scoped automation.
  dco-check:
    name: dco-check
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need base + head commits reachable for the rev-list range
      - name: Verify Signed-off-by on every PR commit
        env:
          CI_MERGE_REQUEST_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/dco-check.sh

  # Pinned gitleaks (OSS) run via Docker, matching the GitLab job's image + args.
  # GitLab-native Secret Detection did not gate on the free tier; this is a real
  # gate that fails on any non-allowlisted finding.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks detect
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.18.2 \
            detect --no-git --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose

  # Single aggregate gate. Require ONLY this check in branch protection: it is a
  # stable name (immune to matrix changes) that still gates on every job above.
  # `if: always()` runs it even when an upstream job is skipped (e.g. dco-check
  # on push events or on renovate/* PRs); a *skipped* dependency is not a
  # failure, so only real failures/cancellations fail the gate.
  ci-success:
    name: ci-success
    if: always()
    needs:
      - build
      - typecheck
      - test
      - lint
      - format-check
      - coverage
      - dependency-pins
      - api-surface
      - dco-check
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required CI jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All required CI jobs passed."
